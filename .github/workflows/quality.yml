name: quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://localhost

      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

      MAIL_MAILER: array
      BROADCAST_CONNECTION: "null"
      FILESYSTEM_DISK: local

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Validate production runtime contract
        run: |
          bash scripts/production/validate-production-runtime-contract.sh --mode=source

          ARTIFACT_DIR="$(mktemp -d)"
          trap 'rm -rf "$ARTIFACT_DIR"' EXIT

          git archive --format=tar HEAD | tar -xf - -C "$ARTIFACT_DIR"
          printf '%s\n' "$(git rev-parse HEAD)" > "$ARTIFACT_DIR/.mvhab-release-sha"

          bash "$ARTIFACT_DIR/scripts/production/validate-production-runtime-contract.sh" --mode=artifact

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: bcmath, mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel CI environment
        run: |
          cat > .env <<'ENV'
          APP_NAME="CRM Habitacao Publica"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          APP_LOCALE=pt
          APP_FALLBACK_LOCALE=pt
          APP_FAKER_LOCALE=pt_PT

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:

          CACHE_STORE=array
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          BROADCAST_CONNECTION=null
          FILESYSTEM_DISK=local

          VITE_APP_NAME="${APP_NAME}"
          ENV

          rm -f \
            bootstrap/cache/config.php \
            bootstrap/cache/services.php \
            bootstrap/cache/packages.php

          mkdir -p \
            bootstrap/cache \
            database \
            storage/framework/views \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/logs

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Clear Laravel bootstrap cache safely
        run: |
          rm -f \
            bootstrap/cache/config.php \
            bootstrap/cache/services.php \
            bootstrap/cache/packages.php

          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Debug Laravel runtime config
        run: |
          php artisan tinker --execute="
              dump(config('cache.default'));
              dump(config('session.driver'));
              dump(config('queue.default'));
              dump(config('database.default'));
              dump(config('database.connections.sqlite.database'));
              dump(config('mail.default'));
              dump(config('broadcasting.default'));
          "

      - name: Check changed PHP code style
        if: github.event_name == 'pull_request'
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: composer quality:pint:changed

      - name: Check global code style
        run: composer quality:pint

      - name: Build frontend assets
        run: npm run build

      - name: Run PHPUnit test suite
        run: php -d memory_limit=1G ./vendor/bin/phpunit --configuration phpunit.xml

      - name: Validate route registration
        run: php artisan route:list --except-vendor

      - name: Run static analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=1G -v
